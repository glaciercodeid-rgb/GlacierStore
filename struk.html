<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
background:#e5e5e5;
display:flex;
gap:20px;
padding:20px;
align-items:flex-start;
}

.panel{
width:340px;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.2);
position:sticky;
top:20px;
}

.panel h2{
margin-bottom:15px;
}

.panel label{
display:block;
margin-top:10px;
font-size:14px;
}

.panel input{
width:100%;
padding:8px;
margin-top:5px;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:10px;
margin-top:12px;
cursor:pointer;
border:none;
border-radius:6px;
font-size:15px;
}

#generate{
background:#2196f3;
color:white;
}

#print{
background:#4caf50;
color:white;
}

.receipt{
width:380px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.logo{
text-align:center;
}

.logo img{
height:56px;
width:auto;
}

.tag{
text-align:center;
color:#555;
margin-top:4px;
margin-bottom:15px;
}

hr{
border:none;
border-top:2px dashed #000;
margin:15px 0;
}

.row{
display:flex;
justify-content:space-between;
margin:7px 0;
font-size:15px;
}

.center{
text-align:center;
}

.total{
font-size:22px;
font-weight:bold;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:20px;
}

.footer{
text-align:center;
margin-top:15px;
font-size:13px;
color:#555;
}

@media print{

body{
background:white;
}

.panel{
display:none;
}

.receipt{
box-shadow:none;
border-radius:0;
margin:auto;
}

}
</style>
</head>

<body>

<div class="panel">

<h2>Receipt Generator</h2>

<label>Order ID</label>
<input id="order">

<label>Tanggal</label>
<input id="tanggal">

<label>Produk</label>
<input id="produk">

<label>Harga</label>
<input id="harga">

<label>ID Tujuan</label>
<input id="userid">

<label>Nickname</label>
<input id="nick">

<label>Ref ID</label>
<input id="ref">

<label>Total</label>
<input id="total">

<label>QR Code (URL / Text)</label>
<input id="qrtext">

<button id="generate">GENERATE</button>

<button id="print">PRINT</button>

</div>

<div class="receipt">

<div class="logo"><img src="assets/logo-icon.png" alt="GlacierStore" /></div>

<div class="tag">
Pasti Murah Pasti Untung
</div>

<hr>

<div class="row">
<span>Order ID</span>
<span id="v_order">-</span>
</div>

<div class="row">
<span>Date/Time</span>
<span id="v_tanggal">-</span>
</div>

<hr>

<div class="row">
<span id="v_produk">Produk</span>
<span id="v_harga">Rp0</span>
</div>

<br>

<div class="row">
<span>ID Tujuan</span>
<span id="v_userid">-</span>
</div>

<div class="center" style="margin-top:15px">

<div id="v_nick"></div>

<div id="v_ref"></div>

</div>

<hr>

<div class="row">
<span>Total</span>
<span class="total" id="v_total">Rp0</span>
</div>

<div id="qrcode"></div>

<div class="footer">
Terimakasih telah berbelanja di GlacierStore
</div>

</div>
    <script>
const $ = (id) => document.getElementById(id);

$("generate").onclick = function(){

    $("v_order").textContent = "#" + $("order").value;
    $("v_tanggal").textContent = $("tanggal").value;
    $("v_produk").textContent = $("produk").value;
    $("v_harga").textContent = $("harga").value;
    $("v_userid").textContent = $("userid").value;
    $("v_nick").textContent = $("nick").value;
    $("v_ref").textContent = "RefID : " + $("ref").value;
    $("v_total").textContent = $("total").value;

    // hapus QR lama
    $("qrcode").innerHTML="";

    // generate QR baru
    new QRCode($("qrcode"),{
        text: $("qrtext").value,
        width:150,
        height:150,
        correctLevel:QRCode.CorrectLevel.H
    });

}

$("print").onclick=function(){
    window.print();
}

// isi otomatis tanggal sekarang
window.onload=function(){

    const d=new Date();

    const pad=n=>String(n).padStart(2,"0");

    $("tanggal").value=
        d.getFullYear()+"-"+
        pad(d.getMonth()+1)+"-"+
        pad(d.getDate())+" "+
        pad(d.getHours())+":"+
        pad(d.getMinutes())+":"+
        pad(d.getSeconds());

}
</script>

</body>
</html>
