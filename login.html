<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Admin - GlacierStore</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700&family=Raleway:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7f8;
        font-family: "Raleway", Arial, sans-serif;
        padding: 20px;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 18px 52px rgba(16, 24, 40, 0.12);
      }
      .login-card h1 {
        font-family: "Exo 2", Arial, sans-serif;
        font-size: 22px;
        margin: 0 0 4px;
        color: #14171f;
      }
      .login-card p.subtitle {
        margin: 0 0 24px;
        font-size: 13px;
        color: #5f6672;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 700;
        color: #14171f;
        margin-bottom: 6px;
      }
      label + label { margin-top: 16px; }
      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d8dde2;
        border-radius: 8px;
        font-size: 14px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #0b8f87;
        outline-offset: 1px;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #0b8f87;
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error-msg {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fdeceb;
        color: #b13d3d;
        font-size: 13px;
        display: none;
      }
      .error-msg.is-visible { display: block; }
      .back-link {
        display: inline-block;
        margin-top: 18px;
        font-size: 13px;
        color: #5f6672;
        text-decoration: none;
      }
      .back-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <form class="login-card" id="login-form">
      <h1>Login Admin</h1>
      <p class="subtitle">GlacierStore — masuk untuk mengelola toko</p>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />

      <button type="submit" id="submit-btn">Masuk</button>
      <p class="error-msg" id="error-msg"></p>
      <a class="back-link" href="index.html">&larr; Kembali ke website</a>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script>
      const form = document.getElementById("login-form");
      const submitBtn = document.getElementById("submit-btn");
      const errorMsg = document.getElementById("error-msg");

      function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.add("is-visible");
      }

      // Kalau sudah login sebelumnya (sesi masih aktif), langsung lempar ke admin.
      window.supabaseClient.auth.getSession().then(({ data }) => {
        if (data.session) window.location.replace("admin.html");
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMsg.classList.remove("is-visible");
        submitBtn.disabled = true;
        submitBtn.textContent = "Memproses...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
          showError(
            error.message === "Invalid login credentials"
              ? "Email atau password salah."
              : error.message
          );
          submitBtn.disabled = false;
          submitBtn.textContent = "Masuk";
          return;
        }

        window.location.replace("admin.html");
      });
    </script>
  </body>
</html>
